services:
  db:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: bmp
      POSTGRES_USER: bmp
      POSTGRES_PASSWORD: ${BMP_DB_PASSWORD:?Set BMP_DB_PASSWORD in .env}
    volumes:
      - postgres_18_data:/var/lib/postgresql

volumes:
  postgres_18_data:
